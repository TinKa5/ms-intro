spring:
  datasource:
    url: ${STORAGE_DB_URL:jdbc:postgresql://localhost:5434/storage-db}
    username: ${STORAGE_DB_USER:postgres}
    password: ${STORAGE_DB_PASSWORD:postgres}

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

server:
  port: 8084
