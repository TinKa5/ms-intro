services:
  resource-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${RESOURCE_DB}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: ms_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"

  song-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SONG_DB}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
    volumes:
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"

  song-service:
    build:
      context: ./song-service
    environment:
      SONG_DB_URL: ${SONG_DB_URL}
      SONG_DB_USER: ${SONG_DB_USER}
      SONG_DB_PASSWORD: ${SONG_DB_PASSWORD}
      DISCOVERY_SERVICE_URL: ${DISCOVERY_SERVICE_URL}
    depends_on:
      - song-db
      - discovery-server
    ports:
      - "8082"

  resource-service:
    build:
      context: ./resource-service
    environment:
      RESOURCE_DB_URL: ${RESOURCE_DB_URL}
      RESOURCE_DB_USER: ${RESOURCE_DB_USER}
      RESOURCE_DB_PASSWORD: ${RESOURCE_DB_PASSWORD}
      SONG_SERVICE_URL: ${SONG_SERVICE_URL}
      DISCOVERY_SERVICE_URL: ${DISCOVERY_SERVICE_URL}
    depends_on:
      - resource-db
      - song-service
      - discovery-server
    ports:
      - "8081:8081"

  discovery-server:
    build:
      context: ./discovery-server
    ports:
      - "8761:8761"

volumes:
  pgadmin: