services:
  resource-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${RESOURCE_DB}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RESOURCE_DB_USER} -d ${RESOURCE_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: ms_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"

  song-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SONG_DB}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SONG_DB_USER} -d ${SONG_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"

  localstack:
    container_name: s3
    image: localstack/localstack:latest
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_S3_REGION}
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: [ "CMD", "awslocal", "s3api", "head-bucket", "--bucket", "ms-audio-bucket" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./init-scripts/aws-s3:/etc/localstack/init/ready.d

  song-service:
    build:
      context: ./song-service
    environment:
      SONG_DB_URL: ${SONG_DB_URL}
      SONG_DB_USER: ${SONG_DB_USER}
      SONG_DB_PASSWORD: ${SONG_DB_PASSWORD}
      DISCOVERY_SERVICE_URL: ${DISCOVERY_SERVICE_URL}
      CONFIG_SERVICE_URL: ${CONFIG_SERVICE_URL}
    healthcheck:
      test: [ "CMD-SHELL",
              "wget -q --spider  http://localhost:8082/actuator/health/readiness || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      song-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8082"

  resource-service:
    build:
      context: ./resource-service
    environment:
      RESOURCE_DB_URL: ${RESOURCE_DB_URL}
      RESOURCE_DB_USER: ${RESOURCE_DB_USER}
      RESOURCE_DB_PASSWORD: ${RESOURCE_DB_PASSWORD}
      SONG_SERVICE_URL: ${SONG_SERVICE_URL}
      DISCOVERY_SERVICE_URL: ${DISCOVERY_SERVICE_URL}
      AWS_DEFAULT_REGION: ${AWS_S3_REGION}
      AWS_S3_CREDENTIALS_ACCESS_KEY: ${AWS_S3_CREDENTIALS_ACCESS_KEY}
      AWS_S3_CREDENTIALS_SECRET_KEY: ${AWS_S3_CREDENTIALS_SECRET_KEY}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      CONFIG_SERVICE_URL: ${CONFIG_SERVICE_URL}
    healthcheck:
      test: [ "CMD-SHELL",
              "wget -q --spider http://localhost:8081/actuator/health/readiness || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      resource-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"

  resource-processor:
    build:
      context: ./resource-processor
    environment:
      DISCOVERY_SERVICE_URL: ${DISCOVERY_SERVICE_URL}
      SONG_SERVICE_URL: ${SONG_SERVICE_URL}
      RESOURCE_SERVICE_URL: ${RESOURCE_SERVICE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      CONFIG_SERVICE_URL: ${CONFIG_SERVICE_URL}
    healthcheck:
      test: [ "CMD-SHELL",
              "wget -q --spider http://localhost:8083/actuator/health/readiness || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      discovery-server:
        condition: service_healthy
      song-service:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"

  discovery-server:
    build:
      context: ./discovery-server
    healthcheck:
      test: [ "CMD-SHELL",
              "wget -q --spider http://localhost:8761/actuator/health/readiness || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      CONFIG_SERVICE_URL: ${CONFIG_SERVICE_URL}
    depends_on:
      config-service:
        condition: service_healthy
    ports:
      - "8761:8761"

  gateway-service:
    build:
      context: ./gateway-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/actuator/health/readiness || exit 1"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 40s
    environment:
      CONFIG_SERVICE_URL: ${CONFIG_SERVICE_URL}
      DISCOVERY_SERVICE_URL: ${DISCOVERY_SERVICE_URL}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8222:8222"

  config-service:
    build:
      context: ./config-server
    healthcheck:
      test: [ "CMD-SHELL",
              "wget -q --spider http://localhost:8888/actuator/health/readiness || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8888:8888"

  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Broker + Controller in one process
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Internal, external and controller listeners
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # KRaft quorum
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # Single-node development settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ua:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8070:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DYNAMIC_CONFIG_ENABLED: 'true'
    restart: unless-stopped

volumes:
  pgadmin: